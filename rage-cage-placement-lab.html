:root[data-theme=&quot;light&quot;] {

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

  text-decoration: none;
  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;

h2,
h3,
h4,
h5,
h6,
p {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;

  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;

.btn,
.form-check-input,
.form-control,
.form-range,

  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {

  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;

  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;

  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {

  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {

}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

  &lt;details class=&quot;rcl-guide&quot;&gt;
    &lt;summary&gt;How to read the simulator&lt;/summary&gt;
    &lt;div class=&quot;rcl-guide-grid text-small&quot;&gt;
      &lt;p&gt;&lt;strong&gt;N means number of players.&lt;/strong&gt; N=5 is a five-person game.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;1.00× fair share means average.&lt;/strong&gt; Below 1.00× is good for drinks; above 1.00× is good for catches you cause.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Percentage points are direct changes.&lt;/strong&gt; 30% minus 8 points equals 22%.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Accuracy&lt;/strong&gt; is the chance one throw lands. &lt;strong&gt;Throw speed&lt;/strong&gt; is how often a player throws.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Clear rate = accuracy × throw speed.&lt;/strong&gt; It estimates how quickly a player finishes a cup.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;A cage&lt;/strong&gt; means being caught repeatedly without making a clean pass. Shaded chart areas show normal run-to-run variation.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Correlation r&lt;/strong&gt; runs from −1 to +1. The sign shows direction; values farther from zero show a stronger relationship.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;O1–O4 are separate goals:&lt;/strong&gt; fewer drinks, fewer cages, avoid the last cup, or cause more catches.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/details&gt;

            skills: order.map(id =&gt; skills[id]),
            throwRates: order.map(id =&gt; throwRates[id]),
            drinkRates: order.map(id =&gt; drinkSpeeds[id]),
            middleCups: cupLimit,
            baseShotTime: Number(shotTimeInput.value),
            stackPenalty: Number(stackInfluenceInput.value) / 100,
            caughtSkillPenalty: Number(caughtPenaltyInput.value) / 100,
            cageThreshold: Number(cageThresholdInput.value),
            focalSeat: -1,
            gapThreshold: 0,
            rushRateMultiplier: 1,
            rushSkillMultiplier: 1
          }, random);
          const roundCatches = Array(count).fill(0);
          order.forEach((id, seat) =&gt; roundCatches[id] = game.drinks[seat]);
          tierIds.forEach((ids, tier) =&gt; {
            const values = ids.map(id =&gt; roundCatches[id]);
            if (metric === &#x27;zero&#x27;) tierValues[tier].push(values.filter(value =&gt; value === 0).length / ids.length * 100);
            else if (metric === &#x27;peak&#x27;) tierValues[tier].push(Math.max(...values));
            else tierValues[tier].push(values.reduce((sum, value) =&gt; sum + value, 0) / ids.length);
          });
          onRound();
          if (performance.now() - lastYield &gt; 12) {
            await new Promise(resolve =&gt; setTimeout(resolve, 0));
            if (token !== sweepToken) return null;
            lastYield = performance.now();
          }
        }
        return tierDefs.reduce((result, tier, index) =&gt; {
          result[tier.key] = {q10: quantile(tierValues[index], .10), median: quantile(tierValues[index], .50), q90: quantile(tierValues[index], .90)};
          return result;
        }, {});
      }

      function renderEmptySweep() {
        sweepAnalysis = null;
        Object.values(sweepCharts).forEach(chart =&gt; chart.innerHTML = &#x27;&lt;text x=&quot;180&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot;&gt;No sweep results yet&lt;/text&gt;&#x27;);
        sweepSummary.textContent = &#x27;Run the sweep to compare the lower, middle and upper shooting-skill thirds across all five group parameters.&#x27;;
      }

      function renderSweepChart(chart, points, definition, yMax, metric) {
        const width = 360, height = 210, margin = {left: 48, right: 12, top: 14, bottom: 35};

        const y = value =&gt; margin.top + (yMax - value) / yMax * plotH;
        const yTicks = Array.from({length: 4}, (_, index) =&gt; yMax * index / 3);
        const xTickIndexes = [...new Set([0, Math.floor((points.length - 1) / 2), points.length - 1])];
        const yFormat = value =&gt; metric === &#x27;zero&#x27; ? `${Math.round(value)}%` : value.toFixed(value &lt; 10 ? 1 : 0);
        const grid = yTicks.map(value =&gt; `&lt;line class=&quot;rcl-grid&quot; x1=&quot;${margin.left}&quot; y1=&quot;${y(value).toFixed(1)}&quot; x2=&quot;${width - margin.right}&quot; y2=&quot;${y(value).toFixed(1)}&quot;&gt;&lt;/line&gt;&lt;text x=&quot;${margin.left - 7}&quot; y=&quot;${(y(value) + 4).toFixed(1)}&quot; text-anchor=&quot;end&quot;&gt;${yFormat(value)}&lt;/text&gt;`).join(&#x27;&#x27;);

        const currentValue = definition.current();

        const bands = tierDefs.map(tier =&gt; {
          const upper = points.map((point, index) =&gt; `${index ? &#x27;L&#x27; : &#x27;M&#x27;} ${x(point.value).toFixed(1)} ${y(point[tier.key].q90).toFixed(1)}`).join(&#x27; &#x27;);
          const lower = points.slice().reverse().map(point =&gt; `L ${x(point.value).toFixed(1)} ${y(point[tier.key].q10).toFixed(1)}`).join(&#x27; &#x27;);
          return `&lt;path class=&quot;rcl-band is-${tier.key}&quot; d=&quot;${upper} ${lower} Z&quot;&gt;&lt;/path&gt;`;
        }).join(&#x27;&#x27;);
        const lines = tierDefs.map(tier =&gt; {
          const line = points.map((point, index) =&gt; `${index ? &#x27;L&#x27; : &#x27;M&#x27;} ${x(point.value).toFixed(1)} ${y(point[tier.key].median).toFixed(1)}`).join(&#x27; &#x27;);
          const marks = points.map(point =&gt; `&lt;circle class=&quot;rcl-point is-${tier.key}&quot; cx=&quot;${x(point.value).toFixed(1)}&quot; cy=&quot;${y(point[tier.key].median).toFixed(1)}&quot; r=&quot;3&quot;&gt;&lt;title&gt;${tier.label}, ${definition.format(point.value)}: median ${yFormat(point[tier.key].median)}, 10–90% ${yFormat(point[tier.key].q10)}–${yFormat(point[tier.key].q90)}&lt;/title&gt;&lt;/circle&gt;`).join(&#x27;&#x27;);
          return `&lt;path class=&quot;rcl-line is-${tier.key}&quot; d=&quot;${line}&quot;&gt;&lt;/path&gt;${marks}`;

      }

      function renderSweepResults() {
        const allValues = sweepAnalysis.results.flatMap(result =&gt; result.points.flatMap(point =&gt; tierDefs.map(tier =&gt; point[tier.key].q90)));
        const yMax = Math.max(1, ...allValues) * 1.08;
        sweepAnalysis.results.forEach(result =&gt; renderSweepChart(sweepCharts[result.key], result.points, result.definition, yMax, sweepAnalysis.metric));
        const changes = sweepAnalysis.results.map(result =&gt; {
          const average = point =&gt; tierDefs.reduce((sum, tier) =&gt; sum + point[tier.key].median, 0) / tierDefs.length;
          return {label: result.definition.label, change: average(result.points[result.points.length - 1]) - average(result.points[0])};
        });
        const strongest = changes.reduce((best, item) =&gt; Math.abs(item.change) &gt; Math.abs(best.change) ? item : best);
        sweepSummary.textContent = `Largest endpoint change: ${strongest.label} (${strongest.change &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${strongest.change.toFixed(sweepAnalysis.metric === &#x27;zero&#x27; ? 1 : 2)}${sweepAnalysis.metric === &#x27;zero&#x27; ? &#x27; pp&#x27; : &#x27;&#x27;}). Bands show run-to-run variation, not uncertainty in the median.`;
      }

      async function runParameterSweep() {
        if (!sweepRunning &amp;&amp; (simulationRunning || explorerRunning || leverageRunning)) { sweepSummary.textContent = &#x27;Finish or cancel the active analysis first.&#x27;; return; }
        if (sweepRunning) {
          sweepToken++; sweepRunning = false; sweepProgress.hidden = true; root.classList.remove(&#x27;rcl-busy&#x27;); lockAnalysisControls(false);
          [sweepMetric, sweepPointsInput, sweepRunsInput].forEach(control =&gt; control.disabled = false);
          analyzeBtn.disabled = false; runSweepBtn.innerHTML = &#x27;&lt;i data-lucide=&quot;chart-no-axes-combined&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Compare settings&#x27;;
          sweepSummary.textContent = &#x27;Parameter sweep cancelled safely.&#x27;;
          if (window.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
          return;
        }
        const points = positiveInteger(sweepPointsInput, &#x27;Sweep points&#x27;, 3);
        const runs = positiveInteger(sweepRunsInput, &#x27;Runs per point&#x27;);
        const cupLimit = positiveInteger(roundLengthInput, &#x27;Middle cups&#x27;);
        if (points === null || runs === null || cupLimit === null) return;
        setRunning(false); sweepRunning = true; root.classList.add(&#x27;rcl-busy&#x27;); lockAnalysisControls(true);
        [sweepMetric, sweepPointsInput, sweepRunsInput].forEach(control =&gt; control.disabled = true);
        analyzeBtn.disabled = true; sweepProgress.hidden = false; sweepProgress.value = 0;
        const token = ++sweepToken, totalRuns = sweepDefs.length * points * runs;
        let completedRuns = 0;
        runSweepBtn.textContent = &#x27;Cancel sweep · 0%&#x27;;
        const results = [];
        try {
          for (let definitionIndex = 0; definitionIndex &lt; sweepDefs.length; definitionIndex++) {
            const definition = sweepDefs[definitionIndex], values = definition.values(points), resultPoints = [];
            for (let valueIndex = 0; valueIndex &lt; values.length; valueIndex++) {
              const value = values[valueIndex], scenario = sweepScenario(definition.key, value);
              const tiers = await simulateSweepPoint(scenario, runs, cupLimit, sweepMetric.value, 3109 + definitionIndex * 100003 + valueIndex * 7919, token, () =&gt; {
                completedRuns++; sweepProgress.value = completedRuns / totalRuns;
                runSweepBtn.textContent = `Cancel sweep · ${Math.round(sweepProgress.value * 100)}%`;
              });
              if (token !== sweepToken || !tiers) return;
              resultPoints.push({value, ...tiers});
            }
            results.push({key: definition.key, definition, points: resultPoints});
          }
        } catch (error) {
          if (token !== sweepToken) return;
          sweepRunning = false; root.classList.remove(&#x27;rcl-busy&#x27;); lockAnalysisControls(false);
          [sweepMetric, sweepPointsInput, sweepRunsInput].forEach(control =&gt; control.disabled = false);
          analyzeBtn.disabled = false; sweepProgress.hidden = true; sweepSummary.textContent = error &amp;&amp; error.message ? error.message : &#x27;The parameter sweep could not be completed.&#x27;;
          runSweepBtn.innerHTML = &#x27;&lt;i data-lucide=&quot;chart-no-axes-combined&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Compare settings&#x27;;
          return;
        }
        sweepAnalysis = {metric: sweepMetric.value, results}; renderSweepResults();
        sweepRunning = false; root.classList.remove(&#x27;rcl-busy&#x27;); lockAnalysisControls(false);
        [sweepMetric, sweepPointsInput, sweepRunsInput].forEach(control =&gt; control.disabled = false);
        analyzeBtn.disabled = false; sweepProgress.hidden = true;
        runSweepBtn.innerHTML = &#x27;&lt;i data-lucide=&quot;chart-no-axes-combined&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Compare settings&#x27;;
        if (window.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function traitQuantile(mean, spread, z) {
        const bounded = Math.max(.001, Math.min(.999, mean));
        return Math.max(.001, Math.min(.999, 1 / (1 + Math.exp(-(Math.log(bounded / (1 - bounded)) + spread * z)))));
      }

      function sampleTrait(mean, spread, random) {
        const u1 = Math.max(1e-9, random()), u2 = random();
        return traitQuantile(mean, spread, Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2));
      }

      function placementScenario(count, archetype, focalClass, pace, random, overrides = {}) {
        const skillMean = Number(skillMeanInput.value) / 100, skillSpread = Math.max(0, Number(spreadInput.value) || 0);
        const throwMean = Number(throwMeanInput.value) / 100, throwSpread = Math.max(0, Number(throwSpreadInput.value) || 0);
        const drinkMean = Number(drinkMeanInput.value) / 100, drinkSpread = Math.max(0, Number(drinkSpreadInput.value) || 0);
        const skills = Array.from({length: count}, () =&gt; sampleTrait(skillMean, skillSpread, random));
        const throwRates = Array.from({length: count}, () =&gt; sampleTrait(throwMean, throwSpread, random));
        const drinkRates = Array.from({length: count}, () =&gt; sampleTrait(drinkMean, drinkSpread, random));
        const focalSeat = ((Math.round(Number(starterOffsetInput.value)) % count) + count) % count;
        const ahead = (focalSeat - 1 + count) % count, behind = (focalSeat + 1) % count;
        skills[focalSeat] = overrides.skill ?? traitQuantile(skillMean, skillSpread, focalClass === &#x27;good&#x27; ? .97 : focalClass === &#x27;bad&#x27; ? -.97 : 0);
        throwRates[focalSeat] = overrides.throwRate ?? throwMean;
        drinkRates[focalSeat] = overrides.drinkRate ?? Math.min(.999, pace === &#x27;fast&#x27; ? traitQuantile(drinkMean, drinkSpread, .85) : drinkMean);
        const pin = (seat, strength) =&gt; {
          const z = strength === &#x27;strong&#x27; ? 1.28 : strength === &#x27;weak&#x27; ? -1.28 : 0;
          skills[seat] = traitQuantile(skillMean, skillSpread, z);
          throwRates[seat] = traitQuantile(throwMean, throwSpread, z * .65);
        };
        if (archetype === &#x27;behindStrong&#x27;) pin(ahead, &#x27;strong&#x27;);
        if (archetype === &#x27;frontOfStrong&#x27;) pin(behind, &#x27;strong&#x27;);
        if (archetype === &#x27;betweenTwoStrong&#x27;) { pin(ahead, &#x27;strong&#x27;); pin(behind, &#x27;strong&#x27;); }
        if (archetype === &#x27;betweenTwoWeak&#x27;) { pin(ahead, &#x27;weak&#x27;); pin(behind, &#x27;weak&#x27;); }
        if (archetype === &#x27;neutral&#x27;) { pin(ahead, &#x27;neutral&#x27;); pin(behind, &#x27;neutral&#x27;); }
        return {skills, throwRates, drinkRates, focalSeat};
      }

      function coreConfigForScenario(count, scenario, policy) {
        return {
          count,
          skills: scenario.skills,
          throwRates: scenario.throwRates,
          drinkRates: scenario.drinkRates,
          middleCups: Number(roundLengthInput.value),
          baseShotTime: Number(shotTimeInput.value),
          stackPenalty: Number(stackInfluenceInput.value) / 100,
          caughtSkillPenalty: Number(caughtPenaltyInput.value) / 100,
          cageThreshold: Number(cageThresholdInput.value),
          focalSeat: scenario.focalSeat,
          gapThreshold: policy === &#x27;rush&#x27; ? Number(gapThresholdInput.value) : 0,
          rushRateMultiplier: policy === &#x27;rush&#x27; ? Number(rushRateInput.value) : 1,
          rushSkillMultiplier: policy === &#x27;rush&#x27; ? Number(rushSkillInput.value) : 1
        };
      }

      function focalOutcomes(game, seat, count) {
        const middleCups = Number(roundLengthInput.value);
        return {
          o1: game.drinks[seat] / Math.max(.001, middleCups / count),
          o2: game.caged[seat] * 100,
          o3: game.heldLastCup[seat] * 100,
          o4: game.catchesMade[seat] / Math.max(.001, game.totalCatches / count)
        };
      }

      function summarizeBatches(batchSums, batchCounts) {
        const values = batchSums.map((sum, index) =&gt; sum / Math.max(1, batchCounts[index]));
        return {q10: quantile(values, .10), median: quantile(values, .50), q90: quantile(values, .90), mean: batchSums.reduce((a, b) =&gt; a + b, 0) / Math.max(1, batchCounts.reduce((a, b) =&gt; a + b, 0))};
      }

      function renderExplorer() {
        const selected = explorerObjective.value, definition = objectiveDefs[selected], points = explorerAnalysis.points;
        const width = 760, height = 330, margin = {left: 62, right: 18, top: 18, bottom: 48};
        const plotW = width - margin.left - margin.right, plotH = height - margin.top - margin.bottom;
        const values = points.flatMap(point =&gt; archetypeDefs.flatMap(arch =&gt; [point.series[arch.key][selected].q10, point.series[arch.key][selected].q90]));
        const yMin = Math.min(0, ...values), yMax = Math.max(1, ...values) * 1.08;
        const x = value =&gt; margin.left + (value - points[0].n) / Math.max(1, points[points.length - 1].n - points[0].n) * plotW;
        const y = value =&gt; margin.top + (yMax - value) / Math.max(.001, yMax - yMin) * plotH;
        const yTicks = Array.from({length: 5}, (_, index) =&gt; yMin + (yMax - yMin) * index / 4);
        const grid = yTicks.map(value =&gt; `&lt;line class=&quot;rcl-grid&quot; x1=&quot;${margin.left}&quot; y1=&quot;${y(value).toFixed(1)}&quot; x2=&quot;${width - margin.right}&quot; y2=&quot;${y(value).toFixed(1)}&quot;&gt;&lt;/line&gt;&lt;text x=&quot;${margin.left - 8}&quot; y=&quot;${(y(value) + 4).toFixed(1)}&quot; text-anchor=&quot;end&quot;&gt;${definition.format(value)}&lt;/text&gt;`).join(&#x27;&#x27;);
        const tickStep = Math.max(1, Math.ceil(points.length / 8));
        const xLabels = points.filter((point, index) =&gt; index % tickStep === 0 || index === points.length - 1).map(point =&gt; `&lt;text x=&quot;${x(point.n).toFixed(1)}&quot; y=&quot;${height - 25}&quot; text-anchor=&quot;middle&quot;&gt;${point.n}&lt;/text&gt;`).join(&#x27;&#x27;);
        const series = archetypeDefs.map((arch, archIndex) =&gt; {
          const upper = points.map((point, index) =&gt; `${index ? &#x27;L&#x27; : &#x27;M&#x27;} ${x(point.n).toFixed(1)} ${y(point.series[arch.key][selected].q90).toFixed(1)}`).join(&#x27; &#x27;);
          const lower = points.slice().reverse().map(point =&gt; `L ${x(point.n).toFixed(1)} ${y(point.series[arch.key][selected].q10).toFixed(1)}`).join(&#x27; &#x27;);
          const line = points.map((point, index) =&gt; `${index ? &#x27;L&#x27; : &#x27;M&#x27;} ${x(point.n).toFixed(1)} ${y(point.series[arch.key][selected].mean).toFixed(1)}`).join(&#x27; &#x27;);
          const marks = points.map(point =&gt; `&lt;circle class=&quot;rcl-point rcl-series-${archIndex + 1}&quot; cx=&quot;${x(point.n).toFixed(1)}&quot; cy=&quot;${y(point.series[arch.key][selected].mean).toFixed(1)}&quot; r=&quot;3&quot;&gt;&lt;title&gt;${arch.label}, N=${point.n}: ${definition.format(point.series[arch.key][selected].mean)} · batch 10–90% ${definition.format(point.series[arch.key][selected].q10)}–${definition.format(point.series[arch.key][selected].q90)} · ${explorerAnalysis.runs.toLocaleString()} runs&lt;/title&gt;&lt;/circle&gt;`).join(&#x27;&#x27;);
          return `&lt;path class=&quot;rcl-band rcl-series-${archIndex + 1}&quot; d=&quot;${upper} ${lower} Z&quot;&gt;&lt;/path&gt;&lt;path class=&quot;rcl-line rcl-series-${archIndex + 1}&quot; d=&quot;${line}&quot;&gt;&lt;/path&gt;${marks}`;
        }).join(&#x27;&#x27;);
        explorerChart.innerHTML = `&lt;title&gt;${definition.label} by placement and group size&lt;/title&gt;&lt;desc&gt;Five placement archetypes with mean outcomes and 10th to 90th percentile variation across simulation batches.&lt;/desc&gt;${grid}&lt;line class=&quot;rcl-axis&quot; x1=&quot;${margin.left}&quot; y1=&quot;${margin.top}&quot; x2=&quot;${margin.left}&quot; y2=&quot;${height - margin.bottom}&quot;&gt;&lt;/line&gt;&lt;line class=&quot;rcl-axis&quot; x1=&quot;${margin.left}&quot; y1=&quot;${height - margin.bottom}&quot; x2=&quot;${width - margin.right}&quot; y2=&quot;${height - margin.bottom}&quot;&gt;&lt;/line&gt;${xLabels}${series}&lt;text x=&quot;${margin.left + plotW / 2}&quot; y=&quot;${height - 5}&quot; text-anchor=&quot;middle&quot;&gt;Group size N&lt;/text&gt;&lt;text x=&quot;15&quot; y=&quot;${margin.top + plotH / 2}&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 15 ${margin.top + plotH / 2})&quot;&gt;${definition.axis}&lt;/text&gt;`;
        explorerLegend.innerHTML = archetypeDefs.map((arch, index) =&gt; `&lt;span class=&quot;rcl-status&quot;&gt;&lt;span class=&quot;rcl-dot&quot; style=&quot;background:var(--viz-series-${index + 1})&quot;&gt;&lt;/span&gt;${arch.label}&lt;/span&gt;`).join(&#x27;&#x27;);
        const small = points[0], large = points[points.length - 1];
        const worstSmall = archetypeDefs.reduce((best, arch) =&gt; small.series[arch.key][selected].mean &gt; small.series[best.key][selected].mean ? arch : best);
        const twoSmall = small.series.betweenTwoStrong.o2.mean, twoLarge = large.series.betweenTwoStrong.o2.mean;
        let crossover = null;
        for (const point of points) {
          const gap = point.series.frontOfStrong[selected].mean - point.series.behindStrong[selected].mean;
          if (crossover !== null &amp;&amp; Math.sign(crossover.gap) !== Math.sign(gap)) { crossover = point.n; break; }
          crossover = {gap};
        }
        explorerSummary.textContent = `${explorerFocal.value === &#x27;bad&#x27; ? &#x27;Newer&#x27; : &#x27;Experienced&#x27;} player: ${worstSmall.label} gives the highest selected result with ${small.n} players. Cage risk with two strong neighbors changes from ${twoSmall.toFixed(1)}% to ${twoLarge.toFixed(1)}% by ${large.n} players.${typeof crossover === &#x27;number&#x27; ? ` The safer side of one strong neighbor switches near ${crossover} players.` : &#x27; The safer side of one strong neighbor does not switch in this range.&#x27;}`;
        const spread = point =&gt; Math.max(...archetypeDefs.map(a =&gt; point.series[a.key].o2.mean)) - Math.min(...archetypeDefs.map(a =&gt; point.series[a.key].o2.mean));
        const defenseBest = archetypeDefs.reduce((best, a) =&gt; small.series[a.key].o1.mean &lt; small.series[best.key].o1.mean ? a : best);
        const offenseBest = archetypeDefs.reduce((best, a) =&gt; small.series[a.key].o4.mean &gt; small.series[best.key].o4.mean ? a : best);
        const checks = [
          [small.series.frontOfStrong.o1.mean &gt; small.series.behindStrong.o1.mean, &#x27;A strong chaser behind raises drink risk&#x27;],
          [twoSmall &gt;= Math.max(...archetypeDefs.filter(a =&gt; a.key !== &#x27;betweenTwoStrong&#x27;).map(a =&gt; small.series[a.key].o2.mean)), &#x27;Between two strong neighbors maximizes small-group cage risk&#x27;],
          [spread(large) &lt;= spread(small), &#x27;Placement-driven cage spread compresses as N grows&#x27;],
          [explorerFocal.value === &#x27;bad&#x27; ? spread(small) &gt; 1 : spread(large) &lt;= spread(small), `${explorerFocal.value === &#x27;bad&#x27; ? &#x27;Weak-player placement matters&#x27; : &#x27;Strong-player placement converges&#x27;} across size`],
          [defenseBest.key !== offenseBest.key, &#x27;Offense and defense prefer different seats&#x27;]
        ];
        hypothesesEl.innerHTML = checks.map(([pass, label]) =&gt; `&lt;li&gt;&lt;strong&gt;${pass ? &#x27;Matches&#x27; : &#x27;Does not match&#x27;}&lt;/strong&gt; · ${label}&lt;/li&gt;`).join(&#x27;&#x27;);
      }

      async function runPlacementExplorer() {
        if (!explorerRunning &amp;&amp; (simulationRunning || sweepRunning || leverageRunning)) { explorerSummary.textContent = &#x27;Finish or cancel the active analysis first.&#x27;; return; }
        if (explorerRunning) { explorerToken++; explorerRunning = false; explorerProgress.hidden = true; runExplorerBtn.textContent = &#x27;Compare positions&#x27;; return; }
        const ceiling = positiveInteger(explorerCeilingInput, &#x27;Largest group&#x27;, 4), runs = positiveInteger(explorerRunsInput, &#x27;Explorer runs&#x27;);
